name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Empaquetar demo local (sin desplegar)
        uses: actions/upload-artifact@v4
        with:
          name: tierras-de-nadie-alpha-local
          path: dist/
          if-no-files-found: error
          retention-days: 30
